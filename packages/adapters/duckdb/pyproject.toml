[project]
name = "dengcode-adapter-duckdb"
version = "0.1.0"
description = "DengCode — adapter DuckDB (QueryEngine + Catalog)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core", "duckdb>=1.1"]

[project.entry-points."dengcode.adapters"]
duckdb_query_engine = "dengcode_adapter_duckdb.engine:DuckDBQueryEngine"
duckdb_catalog = "dengcode_adapter_duckdb.catalog:DuckDBCatalog"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_duckdb"]
