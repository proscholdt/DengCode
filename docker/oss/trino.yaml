# Fragmento da stack open source (fase 5): catálogo Iceberg REST + Trino.
#
# SOMENTE PARA DESENVOLVIMENTO. As credenciais abaixo são as mesmas (públicas e
# fixas) do MinIO de docker/compose.oss.yaml; nunca use em produção.
#
# Feito para ser incluído pelo compose principal:
#
#   include:
#     - oss/trino.yaml
#
# Os caminhos relativos (./trino/...) são relativos a ESTE arquivo — é assim que
# o `include:` resolve. Não use este arquivo com `-f` depois do compose
# principal: com `-f`, os caminhos passam a ser relativos ao primeiro arquivo.
#
# Dependências do compose principal (não declaradas aqui de propósito, para o
# fragmento valer também sozinho): serviço `minio` em http://minio:9000 com o
# bucket `dengcode-exemplo` (criado pelo `minio-init`). Nenhum dos dois
# serviços abaixo precisa do S3 para subir — só para gravar/ler tabelas.
#
# Memória RAM (medida no Windows/Docker Desktop, ociosos):
#   - trino:        ~1,0 GB (heap fixo de 1 GB; limite do container 2 GB)
#   - iceberg-rest: ~0,2 GB (heap máximo de 256 MB)
# Some ~1,3 GB aos ~0,3 GB de Postgres + MinIO. Consultas grandes no Trino
# falham com EXCEEDED_*_MEMORY_LIMIT antes de estourar o container.
#
# Portas e imagens podem ser trocadas por variáveis de ambiente:
#   DENGCODE_TRINO_PORT (8080), DENGCODE_ICEBERG_REST_PORT (8181),
#   DENGCODE_TRINO_IMAGE, DENGCODE_ICEBERG_REST_IMAGE.

services:
  iceberg-rest:
    # servidor de referência da spec Iceberg REST (projeto Apache Iceberg);
    # metadados do catálogo em SQLite no volume, arquivos das tabelas no MinIO
    image: ${DENGCODE_ICEBERG_REST_IMAGE:-apache/iceberg-rest-fixture:1.10.1}
    environment:
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://dengcode-exemplo/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # credenciais de desenvolvimento (dev-only), as mesmas do MinIO
      CATALOG_S3_ACCESS__KEY__ID: dengcode
      CATALOG_S3_SECRET__ACCESS__KEY: dengcode123
      AWS_REGION: us-east-1
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "${DENGCODE_ICEBERG_REST_PORT:-8181}:8181"
    volumes:
      # /home/iceberg já existe na imagem com o dono certo (usuário iceberg)
      - iceberg-rest-data:/home/iceberg
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  trino:
    image: ${DENGCODE_TRINO_IMAGE:-trinodb/trino:484}
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      # heap pequeno de propósito (o padrão da imagem é 80% da RAM do container)
      JAVA_TOOL_OPTIONS: -Xmx1G
      # lidos por ${ENV:...} em trino/catalog/iceberg.properties (dev-only)
      DENGCODE_S3_ACCESS_KEY: dengcode
      DENGCODE_S3_SECRET_KEY: dengcode123
    mem_limit: 2g
    ports:
      - "${DENGCODE_TRINO_PORT:-8080}:8080"
    volumes:
      # substitui os catálogos de exemplo da imagem: iceberg (REST) + memory
      - ./trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      # script da própria imagem: /v1/info respondendo com "starting": false
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  iceberg-rest-data:
