# Raiz do workspace uv (virtual): não é um pacote, só agrupa os membros.
[tool.uv.workspace]
members = ["packages/*", "packages/adapters/*"]
exclude = ["packages/adapters"]

[tool.uv.sources]
dengcode-core = { workspace = true }
dengcode-engine = { workspace = true }
dengcode-cli = { workspace = true }
dengcode-testkit = { workspace = true }
dengcode-adapter-local-fs = { workspace = true }
dengcode-adapter-llm-anthropic = { workspace = true }
dengcode-adapter-llm-openai = { workspace = true }
dengcode-adapter-llm-ollama = { workspace = true }
dengcode-adapter-duckdb = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "testcontainers[minio,postgres]>=4.8",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: precisa de Docker/serviços externos (make test-int)",
]
