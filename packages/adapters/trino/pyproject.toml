[project]
name = "dengcode-adapter-trino"
version = "0.1.0"
description = "DengCode — adapter Trino (QueryEngine + Catalog) sobre o protocolo HTTP do cliente."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dengcode-core",
    "httpx2>=2.12",
    # base de fusos horários do zoneinfo (o Windows não traz uma)
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.entry-points."dengcode.adapters"]
trino_query_engine = "dengcode_adapter_trino.engine:TrinoQueryEngine"
trino_catalog = "dengcode_adapter_trino.catalog:TrinoCatalog"

[dependency-groups]
dev = ["dengcode-testkit"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_trino"]
