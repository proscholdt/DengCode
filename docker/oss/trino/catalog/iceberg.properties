# Catálogo "iceberg" do Trino: metadados no catálogo Iceberg REST, arquivos no MinIO.
# As credenciais vêm de variáveis de ambiente do container (ver docker/oss/trino.yaml).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:DENGCODE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:DENGCODE_S3_SECRET_KEY}
