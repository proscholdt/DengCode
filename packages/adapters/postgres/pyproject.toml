[project]
name = "dengcode-adapter-postgres"
version = "0.1.0"
description = "DengCode — adapter PostgreSQL (QueryEngine + Catalog) com psycopg 3."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core", "psycopg[binary]>=3.2"]

[project.entry-points."dengcode.adapters"]
postgres_query_engine = "dengcode_adapter_postgres.engine:PostgresQueryEngine"
postgres_catalog = "dengcode_adapter_postgres.catalog:PostgresCatalog"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_postgres"]
