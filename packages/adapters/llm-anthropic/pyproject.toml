[project]
name = "dengcode-adapter-llm-anthropic"
version = "0.1.0"
description = "DengCode — adapter anthropic."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core", "anthropic>=2.13", "pyyaml>=6.0"]

[project.entry-points."dengcode.adapters"]
anthropic = "dengcode_adapter_llm_anthropic.llm:AnthropicLLM"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_llm_anthropic"]
