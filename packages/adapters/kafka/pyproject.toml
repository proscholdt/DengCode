[project]
name = "dengcode-adapter-kafka"
version = "0.1.0"
description = "DengCode — adapter de StreamPort para Apache Kafka (aiokafka), com Schema Registry opcional."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core", "aiokafka>=0.13", "httpx2>=2.12"]

[project.entry-points."dengcode.adapters"]
kafka = "dengcode_adapter_kafka.stream:KafkaStream"

[dependency-groups]
dev = ["dengcode-testkit"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_kafka"]
