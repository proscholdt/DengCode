[project]
name = "dengcode-adapter-iceberg-rest"
version = "0.1.0"
description = "DengCode — adapter de CatalogPort para catálogos Iceberg REST (spec aberta, via HTTP)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core", "httpx2>=2.12"]

[project.entry-points."dengcode.adapters"]
iceberg_rest = "dengcode_adapter_iceberg_rest.catalog:IcebergRestCatalog"

[dependency-groups]
dev = ["dengcode-testkit"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_iceberg_rest"]
