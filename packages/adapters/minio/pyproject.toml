[project]
name = "dengcode-adapter-minio"
version = "0.1.0"
description = "DengCode — adapter de StoragePort para MinIO e endpoints compatíveis com S3."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core", "obstore>=0.8"]

[project.entry-points."dengcode.adapters"]
minio = "dengcode_adapter_minio.storage:MinioStorage"

[dependency-groups]
dev = ["dengcode-testkit"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_minio"]
