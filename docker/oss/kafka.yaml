# Fragmento da stack open source (fase 5): Kafka de nó único em modo KRaft
# (sem ZooKeeper) + produtor de exemplo que cria o tópico `pedidos`.
#
# SOMENTE PARA DESENVOLVIMENTO: sem autenticação nem TLS; não exponha a porta.
#
# Uso isolado (a partir da raiz do repositório):
#   docker compose -f docker/oss/kafka.yaml up -d
#   docker compose -f docker/oss/kafka.yaml down
# Ou inclua no compose principal com `include: [oss/kafka.yaml]` (os caminhos
# relativos abaixo são resolvidos a partir desta pasta nos dois casos).
#
# Memória: o broker usa heap fixo de 512 MB e fica limitado a 1 GB de RAM
# (uso típico em repouso: 400–600 MB). O produtor é de execução única e sobe
# uma JVM curta (~250 MB por alguns segundos). Reserve ~1 GB para o Kafka.
#
# Clientes no host: localhost:9092 (DENGCODE_KAFKA_PORT muda a porta).
# Outros containers da mesma rede: kafka:19092.

services:
  kafka:
    image: ${DENGCODE_KAFKA_IMAGE:-apache/kafka:3.9.1}
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST: clientes fora do Docker; DOCKER: containers da rede; CONTROLLER: KRaft
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${DENGCODE_KAFKA_PORT:-9092},DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      # tópicos só nascem por criação explícita (o produtor cria `pedidos`)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "${DENGCODE_KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      # leve (sem subir outra JVM): a porta interna aceita conexões
      test: ["CMD-SHELL", "nc -z localhost 19092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # Execução única: cria o tópico `pedidos` e publica ~50 eventos sintéticos
  # (alguns com e-mail/CPF/telefone falsos). Não duplica se o tópico já tem dados.
  kafka-produtor:
    image: ${DENGCODE_KAFKA_IMAGE:-apache/kafka:3.9.1}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPICO: pedidos
      KAFKA_EVENTOS: "50"
      KAFKA_HEAP_OPTS: -Xmx256m
    volumes:
      - ./kafka:/produtor:ro
    entrypoint: ["sh", "/produtor/produtor.sh"]
    mem_limit: 512m
    restart: "no"

volumes:
  kafka-data:
