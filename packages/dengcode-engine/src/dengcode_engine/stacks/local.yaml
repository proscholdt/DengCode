# Preset local — roda na máquina sem Docker: arquivos do projeto + LLM local (Ollama).
# Troque o LLM sem editar o arquivo: `dengcode chat --llm anthropic` ou `--llm openai:gpt-5`.
name: local
description: Disco local + Ollama (sem Docker, sem nuvem)

llm:
  provider: ollama
  models:
    main: "qwen2.5:7b"
    fast: "qwen2.5:3b"

storage: { adapter: local_fs, root: "." }
memory:  { adapter: sqlite }

environments:
  dev:
    permission_mode: ask
