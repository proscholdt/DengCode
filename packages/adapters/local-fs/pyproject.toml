[project]
name = "dengcode-adapter-local-fs"
version = "0.1.0"
description = "DengCode — adapter de StoragePort para o disco local."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core"]

[project.entry-points."dengcode.adapters"]
local_fs = "dengcode_adapter_local_fs.storage:LocalFsStorage"

[dependency-groups]
dev = ["dengcode-testkit"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_local_fs"]
