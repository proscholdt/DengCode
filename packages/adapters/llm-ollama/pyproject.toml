[project]
name = "dengcode-adapter-llm-ollama"
version = "0.1.0"
description = "DengCode — adapter ollama."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dengcode-core", "httpx2>=2.12", "pyyaml>=6.0"]

[project.entry-points."dengcode.adapters"]
ollama = "dengcode_adapter_llm_ollama.llm:OllamaLLM"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_adapter_llm_ollama"]
