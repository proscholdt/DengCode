[project]
name = "dengcode-cli"
version = "0.1.0"
description = "DengCode — interface de linha de comando."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dengcode-engine",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
dengcode = "dengcode_cli.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_cli"]
