# Preset open source — roda inteiro local com Docker, inclusive o LLM (Ollama).
name: opensource
description: MinIO + DuckDB/Trino/Spark + Airflow + Iceberg REST + Kafka + dbt-core + Ollama

llm:
  provider: ollama
  models:
    main: "<modelo local com suporte a tools>"
    fast: "<modelo local menor>"
embedding: { provider: local, model: "<modelo de embedding local>" }

storage:        { adapter: minio, endpoint: "http://localhost:9000" }
table_format:   iceberg
compute:
  - { adapter: duckdb, database: ":memory:" }
  - { adapter: trino, host: localhost, port: 8080 }
  - { adapter: spark }
orchestrator:   { adapter: airflow, url: "http://localhost:8081" }
catalog:        { adapter: iceberg_rest, url: "http://localhost:8181" }
transform:      { adapter: dbt_core, project_dir: "./dbt" }
streaming:      { adapter: kafka, bootstrap_servers: "localhost:9092" }
stream_compute: []
secrets:        { adapter: env }      # .env / variáveis de ambiente
memory:         { adapter: sqlite }

environments:
  dev:
    permission_mode: ask
