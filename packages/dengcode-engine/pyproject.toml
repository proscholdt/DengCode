[project]
name = "dengcode-engine"
version = "0.1.0"
description = "DengCode — motor: carrega stacks, registra adapters e expõe o servidor ACP."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dengcode-core",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_engine"]
