[project]
name = "dengcode-testkit"
version = "0.1.0"
description = "DengCode — suítes de contrato por porta e fakes para testes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dengcode-core",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengcode_testkit"]
