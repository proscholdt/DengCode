# Preset Google Cloud — tudo no ecossistema Google, inclusive o LLM.
name: google
description: GCS + BigQuery/Dataproc + Airflow (Composer) + Dataplex + Pub/Sub + Vertex AI

llm:
  provider: vertex_ai
  models:
    main: "<modelo principal no Vertex AI>"
    fast: "<modelo barato no Vertex AI>"
embedding: { provider: vertex_ai, model: "<modelo de embedding>" }

storage:        { adapter: gcs }
table_format:   iceberg
compute:
  - { adapter: bigquery, metered: true }
  - { adapter: dataproc_spark }
orchestrator:   { adapter: airflow, variant: composer }
catalog:        { adapter: dataplex }
transform:      null
streaming:      { adapter: pubsub }
stream_compute:
  - { adapter: dataflow }
secrets:        { adapter: gcp_secret_manager }
memory:         { adapter: sqlite }

environments:
  dev:
    credentials_profile: gcp-dev
    permission_mode: ask
    cost_limit: { bytes: 10000000000 }   # 10 GB processados
  prod:
    credentials_profile: gcp-prod
    permission_mode: read_only
    read_only: true
    cost_limit: { bytes: 1000000000 }    # 1 GB processado
